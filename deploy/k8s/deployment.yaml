# Enterprise MCP Server - Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-mcp
  labels:
    app: enterprise-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-mcp
  template:
    metadata:
      labels:
        app: enterprise-mcp
    spec:
      containers:
        - name: enterprise-mcp
          image: your-registry/enterprise-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_SERVER_NAME
              value: enterprise-mcp
            - name: AUTH_ENABLED
              value: "true"
            # 生产环境建议通过 Secret 注入，勿明文
            - name: API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: mcp-api-tokens
                  key: tokens
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: RATE_LIMIT_PER_MINUTE
              value: "60"
            - name: DESENSITIZE_ENABLED
              value: "true"
            - name: AUDIT_ENABLED
              value: "true"
            - name: AUDIT_OUTPUT
              value: "console"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-mcp
  labels:
    app: enterprise-mcp
spec:
  selector:
    app: enterprise-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
