[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp"
version = "0.1.0"
description = "Enterprise-grade MCP Server scaffold built on FastMCP: auth, rate limiting, desensitization, audit logging, and K8s-ready deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Allen Lin", email = "iyabao@vip.qq.com" }]
keywords = ["mcp", "fastmcp", "llm", "agent", "ai", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=4.0.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
enterprise-mcp = "enterprise_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
